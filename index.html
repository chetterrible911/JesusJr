<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W2TE15G3S9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-W2TE15G3S9');
  </script>
  <meta property="og:image" content="https://www.jesusjr.band/images/thumbnail.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <title>Jesus Jr</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      background: black;
      font-family: "Courier New", Courier, monospace;
      overflow-x: hidden;
    }
html {
  scroll-snap-type: y mandatory;
}
    
    .panel {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100svh;
  height: 100dvh;
  overflow: hidden;
  scroll-snap-align: start;
}
  
.panel:last-child {
  overflow: hidden;
  touch-action: pan-y;
}
    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Email form — page 2 */
    .form-wrapper {
      position: absolute;
      z-index: 2;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;

      /* ============================
         ADJUST FORM POSITION HERE
         (% from top of panel)
         ============================ */
      top: 45%;
    }
    form {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    input[type="email"] {
      padding: 20px;
      font-size: 25px;
      border: none;
      border-radius: 4px;
      width: 300px;
    }
    button {
      padding: 20px;
      font-size: 25px;
      border: none;
      cursor: pointer;
      background: white;
      color: black;
      border-radius: 4px;
    }

    /* Music link — page 3 */
    .link-wrapper {
      position: absolute;
      z-index: 2;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;

      /* ============================
         ADJUST LINK POSITION HERE
         (px from top of panel)
         ============================ */
      top: 400px;
    }
    .link-wrapper a {
      display: block;
      color: black;
      font-family: "Courier New", Courier, monospace;
      font-size: 40px;
      text-decoration: bold;
      letter-spacing: 0.05em;
    }
    .link-wrapper a:hover {
      text-decoration: underline;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .hero-image {
        object-fit: cover;
        object-position: center;
      }
      input[type="email"] {
        width: 150px;
        font-size: 12px;
        padding: 5px;
      }
      button {
        font-size: 12px;
        padding: 5px;
      }
      .link-wrapper a {
        font-weight: bold;
        font-size: 20px;
        letter-spacing: 0.05em;
      }

      /* ============================
         ADJUST MOBILE POSITIONS HERE
         ============================ */
      .form-wrapper {
        top: 50%;
      }
      .link-wrapper {
        top: 350px;
      }
    }
  </style>
</head>
<body>

  <!-- Page 1 -->
  <div class="panel">
    <picture>
      <source media="(max-width: 768px)" srcset="images/mobile-1.jpg">
      <img src="images/desktop-1.jpg" alt="Jesus Jr" class="hero-image" />
    </picture>
  </div>

  <!-- Page 2 — email form -->
  <div class="panel">
    <picture>
      <source media="(max-width: 768px)" srcset="images/mobile-2.jpg">
      <img src="images/desktop-2.jpg" alt="Jesus Jr" class="hero-image" />
    </picture>
    <div class="form-wrapper">
      <form action="https://formspree.io/f/xaqoyrvb" method="POST">
        <input
          type="email"
          name="email"
          placeholder="email"
          required
        />
        <button type="submit">send</button>
      </form>
    </div>
  </div>

  <!-- Page 3 — music link -->
  <div class="panel">
    <picture>
      <source media="(max-width: 768px)" srcset="images/mobile-3.jpg">
      <img src="images/desktop-3.jpg" alt="Jesus Jr" class="hero-image" />
    </picture>
    <div class="link-wrapper">
      <a href="https://chetterrible.bandcamp.com/yum" target="_blank">
        chetterrible.bandcamp.com/yum
      </a>
    </div>
  </div>

</body>
</html>
