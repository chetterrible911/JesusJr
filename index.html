<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W2TE15G3S9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-W2TE15G3S9');
  </script>
  <meta property="og:image" content="https://www.jesusjr.band/images/thumbnail.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <title>Jesus Jr</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: #e8e4d8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      overflow: hidden;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .lower {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 60px;
      padding: 0 28px 32px;
    }

    .player-wrap {
      width: 100%;
      max-width: 360px;
    }

    .email-row {
      display: flex;
      width: 100%;
      max-width: 360px;
      border: 1.5px solid #1a180f;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.4);
      background: rgba(235, 231, 220, 0.6);
    }

    .email-row input[type="email"] {
      flex: 1;
      padding: 11px 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      border: none;
      background: transparent;
      color: #111;
      outline: none;
    }

    .email-row input[type="email"]::placeholder {
      color: rgba(0,0,0,0.38);
    }

    .email-row button {
      padding: 11px 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      border-left: 1.5px solid #1a180f;
      background: #1a180f;
      color: #e8e4d8;
      cursor: pointer;
      transition: background 0.15s;
    }

    .email-row button:hover { background: #333; }

    .confirmation {
      display: none;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: #1a180f;
      text-align: center;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="page">
    <img src="background.png" alt="" class="bg" />
    <div class="lower">
      <div class="player-wrap">
        <iframe style="border: 0; width: 100%; height: 42px;" src="https://bandcamp.com/EmbeddedPlayer/track=2242435649/size=small/bgcol=ffffff/linkcol=0687f5/transparent=true/" seamless><a href="https://chetterrible.bandcamp.com/track/comanche-tx">Comanche, TX by Jesus Jr</a></iframe>
      </div>
      <div class="email-row" id="formRow">
        <input type="email" id="emailInput" placeholder="email" required />
        <button id="sendBtn" type="button">Send</button>
      </div>
      <div class="confirmation" id="confirmation">
        You're on the list.<br>—Chet Terrible
      </div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('sendBtn');
    const input = document.getElementById('emailInput');
    const formRow = document.getElementById('formRow');
    const confirmation = document.getElementById('confirmation');

    btn.addEventListener('click', async () => {
      const email = input.value.trim();
      if (!email || !email.includes('@')) { input.focus(); return; }
      btn.textContent = '...';
      btn.disabled = true;
      try {
        await fetch('https://api.staticforms.dev/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey: 'sf_d1c7692183e35c62716b4840', email })
        });
      } catch(e) {}
      formRow.style.display = 'none';
      confirmation.style.display = 'block';
    });

    input.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
  </script>
</body>
</html>
